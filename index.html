<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Jogo de Adivinhação</title>
</head>
<body>
  <div class="container">
    <h1>Guessing game</h1>
    <p>Adivinhe um número entre 1 e 100</p>
    
    <input type="number" id="palpite" placeholder="Digite um número" min="1" max="100">
    <button id="btn-palpite">Enviar Palpite</button>
    
    <div id="mensagem">
      <h4>Dica</h4>
      <p>O número é maior</p>
    </div>

    <button id="btn-sorte">Boa sorte</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
